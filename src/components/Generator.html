<script :setup>
  const { QUIET_ZONE, qrMatrix, qrPath, qrPngBlob, qrSvg } = await import("../lib/qr.js")
  const { wifiPayload } = await import("../lib/payload.js")
  const { downloadBlob, flasher } = await import("../lib/ui.js")

  let mode = "text"
  let text = ""
  let wifi = { ssid: "", password: "", security: "WPA", hidden: false }
  let ecc = "M"
  let fg = "#000000"
  let bg = "#ffffff"
  let notice = ""

  $: payload = mode === "wifi" ? (wifi.ssid ? wifiPayload(wifi) : "") : text

  // only strings and numbers reach the store: the matrix itself stays a plain
  // local, so drawing a large code doesn't go through the reactive proxy
  const build = (content, level) => {
    if (!content) return { path: "", size: 0, modules: 0, error: "" }
    try {
      const matrix = qrMatrix(content, { ecc: level })
      return { path: qrPath(matrix), size: matrix.length + QUIET_ZONE * 2, modules: matrix.length, error: "" }
    } catch {
      return {
        path: "",
        size: 0,
        modules: 0,
        error: "Hay demasiado contenido para un código QR. Acórtalo o baja la corrección de errores.",
      }
    }
  }

  $: qr = build(payload, ecc)

  const flash = flasher(message => { notice = message })
  const pngBlob = () => qrPngBlob(qrMatrix(payload, { ecc }), { fg, bg })

  const downloadPng = async () => downloadBlob(await pngBlob(), "qr.png")

  const downloadSvg = () => {
    const svg = qrSvg(qrMatrix(payload, { ecc }), { fg, bg })
    downloadBlob(new Blob([svg], { type: "image/svg+xml" }), "qr.svg")
  }

  const canCopy = typeof ClipboardItem === "function" && typeof navigator.clipboard?.write === "function"

  const copyImage = async () => {
    try {
      // the promise form keeps Safari's user-activation window open
      await navigator.clipboard.write([new ClipboardItem({ "image/png": pngBlob() })])
      flash("Imagen copiada")
    } catch {
      flash("No se pudo copiar la imagen")
    }
  }

  const canShare =
    typeof navigator.canShare === "function" &&
    navigator.canShare({ files: [new File([""], "qr.png", { type: "image/png" })] })

  const share = async () => {
    try {
      const file = new File([await pngBlob()], "qr.png", { type: "image/png" })
      await navigator.share({ files: [file], title: "Código QR" })
    } catch (error) {
      if (error?.name !== "AbortError") flash("No se pudo compartir")
    }
  }
</script>

<div class="generator">
  <div class="card editor">
    <div class="segmented" role="group" aria-label="Tipo de contenido">
      <button type="button" :aria-pressed="mode === 'text'" @click="mode = 'text'">Texto o enlace</button>
      <button type="button" :aria-pressed="mode === 'wifi'" @click="mode = 'wifi'">WiFi</button>
    </div>

    <label :if="mode === 'text'" class="field">
      <span>Contenido</span>
      <textarea rows="5" placeholder="Escribe un texto o pega un enlace…" :value="text"
        @input="text = $event.target.value"></textarea>
    </label>

    <div :else class="fields">
      <label class="field">
        <span>Nombre de la red (SSID)</span>
        <input type="text" name="ssid" autocomplete="off" autocapitalize="off" spellcheck="false"
          :value="wifi.ssid" @input="wifi.ssid = $event.target.value">
      </label>
      <label class="field">
        <span>Seguridad</span>
        <select name="security" :value="wifi.security" @change="wifi.security = $event.target.value">
          <option value="WPA">WPA/WPA2/WPA3</option>
          <option value="WEP">WEP</option>
          <option value="nopass">Sin contraseña</option>
        </select>
      </label>
      <label :if="wifi.security !== 'nopass'" class="field">
        <span>Contraseña</span>
        <input type="text" name="password" autocomplete="off" autocapitalize="off" spellcheck="false"
          :value="wifi.password" @input="wifi.password = $event.target.value">
      </label>
      <label class="check">
        <input type="checkbox" name="hidden" :checked="wifi.hidden" @change="wifi.hidden = $event.target.checked">
        Red oculta
      </label>
    </div>

    <details class="options">
      <summary>Opciones</summary>
      <div class="options-grid">
        <label class="field">
          <span>Corrección de errores</span>
          <select name="ecc" :value="ecc" @change="ecc = $event.target.value">
            <option value="L">Baja · 7%</option>
            <option value="M">Media · 15%</option>
            <option value="Q">Alta · 25%</option>
            <option value="H">Máxima · 30%</option>
          </select>
        </label>
        <label class="field">
          <span>Color</span>
          <input type="color" name="fg" :value="fg" @input="fg = $event.target.value">
        </label>
        <label class="field">
          <span>Fondo</span>
          <input type="color" name="bg" :value="bg" @input="bg = $event.target.value">
        </label>
      </div>
    </details>
  </div>

  <div class="card output">
    <div class="preview">
      <svg :if="qr.path" class="qr" :viewBox="`0 0 ${qr.size} ${qr.size}`" shape-rendering="crispEdges"
        role="img" aria-label="Código QR generado">
        <rect :width="qr.size" :height="qr.size" :fill="bg" />
        <path :d="qr.path" :fill="fg" />
      </svg>
      <p :elseif="qr.error" class="message error">{{ qr.error }}</p>
      <p :else class="message">
        {{ mode === "wifi" ? "Escribe el nombre de la red para generar su código" : "Escribe algo para generar su código" }}
      </p>
    </div>

    <p class="meta">
      {{ qr.path ? `${qr.modules}×${qr.modules} módulos · ${payload.length} caracteres` : "" }}
    </p>

    <div class="actions">
      <button type="button" class="btn primary" :disabled="!qr.path" @click="downloadPng">Descargar PNG</button>
      <button type="button" class="btn" :disabled="!qr.path" @click="downloadSvg">SVG</button>
      <button :if="canCopy" type="button" class="btn" :disabled="!qr.path" @click="copyImage">Copiar</button>
      <button :if="canShare" type="button" class="btn" :disabled="!qr.path" @click="share">Compartir</button>
    </div>

    <p class="notice" role="status">{{ notice }}</p>
  </div>
</div>
