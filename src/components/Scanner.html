<script :setup="{ active }">
  const { cameraErrorMessage, openCamera, scanImageFile, scanVideoFrame } = await import("../lib/scan.js")
  const { addToHistory, loadHistory, saveHistory } = await import("../lib/history.js")
  const { parsePayload } = await import("../lib/payload.js")
  const ScanResult = await import("./ScanResult.html")

  let camera = "off" // off | starting | on
  let dragging = false
  let error = ""
  let result = ""
  let scans = loadHistory()

  // the result renders below the viewer, out of sight on a phone
  const reveal = () =>
    requestAnimationFrame(() => $self(".result")?.scrollIntoView({ behavior: "smooth", block: "nearest" }))

  const found = text => {
    result = text
    error = ""
    scans = addToHistory($toRaw(scans), text)
    saveHistory($toRaw(scans))
    navigator.vibrate?.(60)
    reveal()
  }

  // the stream, the timer and the frame canvas are bookkeeping, not state the
  // template renders, so they live in this closure instead of the store
  const { startCamera, stopCamera } = (() => {
    let stream = null
    let timer = null
    const canvas = document.createElement("canvas")

    const stopCamera = () => {
      clearTimeout(timer)
      stream?.getTracks().forEach(track => track.stop())
      stream = null
      const video = $self("video")
      if (video) video.srcObject = null
      camera = "off"
    }

    const tick = async video => {
      let text = null
      try {
        text = await scanVideoFrame(video, canvas)
      } catch {
        // a frame that can't be read is just skipped
      }
      if (!stream) return // stopped while this frame was being decoded
      if (text) {
        stopCamera()
        found(text)
      } else {
        timer = setTimeout(() => tick(video), 150)
      }
    }

    const startCamera = async () => {
      if (camera !== "off") return
      camera = "starting"
      error = ""
      result = ""
      try {
        const media = await openCamera()
        if (camera !== "starting") {
          // stopped (another tab, the page hidden) while the permission prompt was open
          media.getTracks().forEach(track => track.stop())
          return
        }
        stream = media
        const video = $self("video")
        video.muted = true
        video.srcObject = media
        await video.play()
        camera = "on"
        tick(video)
      } catch (failure) {
        if (camera === "off") return // stopped on purpose while starting
        stopCamera()
        error = cameraErrorMessage(failure)
      }
    }

    return { startCamera, stopCamera }
  })()

  const pause = isActive => {
    if (!isActive) stopCamera()
  }

  $: pause(active)

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopCamera()
  })

  const scanFile = async file => {
    if (!file?.type.startsWith("image/")) return
    stopCamera()
    error = ""
    result = ""
    try {
      const text = await scanImageFile(file)
      if (text) found(text)
      else error = "No se ha encontrado ningún código QR en la imagen."
    } catch {
      error = "No se ha podido abrir la imagen."
    }
  }

  const onFileInput = event => {
    scanFile(event.target.files?.[0])
    event.target.value = "" // so choosing the same file again still fires `change`
  }

  const onDrop = event => {
    dragging = false
    scanFile(event.dataTransfer?.files?.[0])
  }

  window.addEventListener("paste", event => {
    if (!active) return
    const file = [...(event.clipboardData?.files ?? [])].find(item => item.type.startsWith("image/"))
    if (file) {
      event.preventDefault()
      scanFile(file)
    }
  })

  const show = text => {
    stopCamera()
    error = ""
    result = text
    reveal()
  }

  const clearHistory = () => {
    scans = []
    saveHistory([])
  }

  const formatDate = at => new Date(at).toLocaleString("es", { dateStyle: "short", timeStyle: "short" })
</script>

<div class="scanner">
  <div class="card viewer">
    <div class="stage" :class.live="camera !== 'off'" :class.dragging="dragging"
      @dragover.prevent="dragging = true" @dragleave="dragging = false" @drop.prevent="onDrop">
      <video muted playsinline :class.is-hidden="camera === 'off'"></video>
      <div :if="camera !== 'off'" class="frame" aria-hidden="true"></div>
      <div :else class="placeholder">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7 12h10" />
        </svg>
        <p>Usa la cámara, abre una imagen o arrástrala aquí. También puedes pegarla con Ctrl+V.</p>
      </div>
    </div>

    <div class="actions">
      <button :if="camera === 'off'" type="button" class="btn primary" @click="startCamera">Usar la cámara</button>
      <button :else type="button" class="btn" @click="stopCamera">
        {{ camera === "starting" ? "Abriendo la cámara…" : "Detener la cámara" }}
      </button>
      <label class="btn">
        Abrir imagen
        <input type="file" accept="image/*" class="visually-hidden" @change="onFileInput">
      </label>
    </div>

    <p :if="error" class="error" role="alert">{{ error }}</p>
  </div>

  <ScanResult :if="result" :payload="result" />

  <section :if="scans.length" class="card history">
    <header>
      <h2>Historial</h2>
      <button type="button" class="btn small ghost" @click="clearHistory">Borrar</button>
    </header>
    <ul>
      <li :each="item in scans" :key="item.text">
        <button type="button" @click="show(item.text)">
          <span class="kind">{{ parsePayload(item.text).label }}</span>
          <span class="text">{{ item.text }}</span>
          <time>{{ formatDate(item.at) }}</time>
        </button>
      </li>
    </ul>
  </section>
</div>
