<script :setup="{ payload }">
  const { parsePayload } = await import("../lib/payload.js")
  const { flasher } = await import("../lib/ui.js")

  let notice = ""

  $: info = parsePayload(payload)

  const flash = flasher(message => { notice = message })

  const copy = async (value, message = "Copiado") => {
    try {
      await navigator.clipboard.writeText(value)
      flash(message)
    } catch {
      flash("No se pudo copiar")
    }
  }

  const canShare = typeof navigator.share === "function"

  const share = async () => {
    try {
      await navigator.share({ text: payload })
    } catch {
      // cancelled by the user
    }
  }
</script>

<article class="card result">
  <span class="badge">{{ info.label }}</span>

  <dl :if="info.type === 'wifi'" class="details">
    <div><dt>Red</dt><dd>{{ info.ssid }}</dd></div>
    <div><dt>Seguridad</dt><dd>{{ info.securityLabel }}</dd></div>
    <div :if="info.password"><dt>Contraseña</dt><dd class="mono">{{ info.password }}</dd></div>
    <div :if="info.hidden"><dt>Red oculta</dt><dd>Sí</dd></div>
  </dl>
  <p :else class="content">{{ info.type === "contact" && info.name ? info.name : payload }}</p>

  <div class="actions">
    <a :if="info.href" class="btn primary" :href="info.href"
      :target="info.type === 'url' || info.type === 'geo' ? '_blank' : null" rel="noopener noreferrer">{{ info.action }}</a>
    <button :if="info.type === 'wifi' && info.password" type="button" class="btn primary"
      @click="copy(info.password, 'Contraseña copiada')">Copiar contraseña</button>
    <button type="button" class="btn" @click="copy(payload)">Copiar texto</button>
    <button :if="canShare" type="button" class="btn" @click="share">Compartir</button>
  </div>

  <p class="notice" role="status">{{ notice }}</p>
</article>
