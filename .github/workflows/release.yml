name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

# one release at a time: a second one waits instead of racing the version bump
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # tests + build, with the new version baked into the app
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
    with:
      bump: ${{ inputs.bump }}

  # the extension, packaged before anything is tagged: a failed upload stops
  # the release instead of leaving it half done
  extension:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # Firefox: API credentials from https://addons.mozilla.org/developers/addon/api/key/
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
      # Chrome Web Store (optional): publishing is skipped without them
      CWS_EXTENSION_ID: ${{ vars.CHROME_WEBSTORE_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      # scripts/amo.js
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: extension
          path: dist-extension

      - name: Package for Chrome
        run: |
          mkdir -p out
          (cd dist-extension/chrome && zip -qr "../../out/qr-extension-chrome-v$VERSION.zip" .)

      # unlisted: AMO signs it without listing it, and it's installed from Pages.
      # AMO usually approves it in a minute, but it may send it to a human review
      # that takes days: the release doesn't wait for that. Without the signed
      # .xpi, firefox.yml adds it to the release and to Pages once approved
      - name: Sign for Firefox
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          # AMO ties the id to the account for good: never sign the build's fallback
          if [ -z "$FIREFOX_EXTENSION_ID" ]; then
            echo "::error::Set the repository variable FIREFOX_EXTENSION_ID (the Firefox add-on id) to sign the extension"
            exit 1
          fi
          # a release that failed after uploading left this version on AMO,
          # which refuses the same version twice
          STATUS=$(node scripts/amo.js status "$VERSION")
          if [ "$STATUS" = none ]; then
            npx --yes web-ext@8 sign \
              --source-dir dist-extension/firefox \
              --channel unlisted \
              --approval-timeout 0 \
              --api-key "$AMO_JWT_ISSUER" \
              --api-secret "$AMO_JWT_SECRET"
          else
            echo "::warning::Version $VERSION is already on AMO ($STATUS): not uploaded again"
          fi
          node scripts/amo.js download "$VERSION" "out/qr-extension-firefox-v$VERSION.xpi" 300

      - name: Publish to the Chrome Web Store
        if: env.CWS_EXTENSION_ID != '' && env.CWS_REFRESH_TOKEN != ''
        run: |
          npx --yes chrome-webstore-upload-cli@3 \
            --source "out/qr-extension-chrome-v$VERSION.zip" \
            --extension-id "$CWS_EXTENSION_ID" \
            --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN"

      - uses: actions/upload-artifact@v7
        with:
          name: extension-release
          path: out/
          if-no-files-found: error

  release:
    needs: [build, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version bump and create the release
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit and tag
        id: bump
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG=$(npm version "$VERSION" -m "chore(release): %s")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        run: git push origin HEAD --follow-tags

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: extension-release
          path: extension-release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          (cd dist && zip -qr "../qr-$TAG.zip" .)
          gh release create "$TAG" "qr-$TAG.zip" extension-release/* --title "$TAG" --generate-notes

  deploy:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
