name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

# one release at a time: a second one waits instead of racing the version bump
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # tests + build, with the new version baked into the app
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
    with:
      bump: ${{ inputs.bump }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version bump and create the release
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit and tag
        id: bump
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG=$(npm version "$VERSION" -m "chore(release): %s")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        run: git push origin HEAD --follow-tags

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          (cd dist && zip -qr "../qr-$TAG.zip" .)
          gh release create "$TAG" "qr-$TAG.zip" --title "$TAG" --generate-notes

  # the exact build that was tested and released. Requires Pages to use
  # "GitHub Actions" as its source (Settings > Pages)
  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
