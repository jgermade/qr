name: Build

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this same build and publishes its `dist` artifact
  workflow_call:
    inputs:
      bump:
        description: Version bump (patch, minor, major) applied before building, so the app shows the version being released. Not committed here
        type: string
        default: ""
    outputs:
      version:
        description: Version the app was built with
        value: ${{ jobs.build.outputs.version }}
      site_url:
        description: URL the app is deployed to, which the extension links to and gets its updates from
        value: ${{ jobs.build.outputs.site_url }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      site_url: ${{ env.SITE_URL }}
    env:
      # with a custom domain, set the repository variable SITE_URL (ending in /)
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      # the Firefox add-on id, in the extension's manifest and looked up by the app
      FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bump version
        if: inputs.bump
        env:
          BUMP: ${{ inputs.bump }}
        run: npm version "$BUMP" --no-git-tag-version

      - name: Read version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - run: npm test

      - run: npm run build
        env:
          # GitHub Pages serves a project site under /<repo>/. With a custom
          # domain, set the repository variable BASE_PATH to "/"
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          # the extension's id once it's in the Chrome Web Store: the app links to it
          CHROME_WEBSTORE_ID: ${{ vars.CHROME_WEBSTORE_ID }}

      # dist-extension/chrome and dist-extension/firefox
      - run: npm run build:extension

      # Mozilla's own checks, the ones AMO runs when signing. --self-hosted:
      # the .xpi is served from Pages, with its own update_url
      - run: npx --yes web-ext@8 lint --self-hosted --source-dir dist-extension/firefox

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist-extension/
          if-no-files-found: error
