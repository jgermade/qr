name: Build

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this same build and publishes its `dist` artifact
  workflow_call:
    inputs:
      bump:
        description: Version bump (patch, minor, major) applied before building, so the app shows the version being released. Not committed here
        type: string
        default: ""
    outputs:
      version:
        description: Version the app was built with
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bump version
        if: inputs.bump
        env:
          BUMP: ${{ inputs.bump }}
        run: npm version "$BUMP" --no-git-tag-version

      - name: Read version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - run: npm test

      - run: npm run build
        env:
          # GitHub Pages serves a project site under /<repo>/. With a custom
          # domain, set the repository variable BASE_PATH to "/"
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
